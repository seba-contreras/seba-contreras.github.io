breadcrumbs: false
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - content/overview.html
  - README.md
  - build_jekyll.py
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - preview.sh
  - README.md
  - vendor
encoding: "utf-8"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Berlin

plugins:
  - jekyll-sitemap

compress_html:
  clippings: all
  # Keep JavaScript line boundaries intact in production. The chaos article's
  # inline plotting code uses line comments and automatic semicolon insertion.
  blanklines: true
  ignore:
    envs: development
