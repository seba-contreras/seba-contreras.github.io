bio: 'You''ve found me! I am Seba Contreras, a complex-systems physicist working at the boundary between statistical
  physics and epidemiology. I am Associate Professor at the International Research Center for Complexity Sciences
  of Beihang University (Hangzhou International Innovation Institute, H3I) and External Faculty at the Interdisciplinary
  Center for Mathematical Modeling of Infectious Disease Dynamics (IMMIDD) of the University of Münster. Before
  that, I was a doctoral and postdoctoral researcher in the Priesemann group at the Max Planck Institute for Dynamics
  and Self-Organization in Göttingen.


  I study spreading processes in adaptive systems: how epidemics and behaviours propagate on temporal contact networks
  that themselves react to what is spreading. Using mathematical modelling, I search for general principles in the
  dynamics of infectious diseases and quantitative insight into the controllability of outbreaks — from non-pharmaceutical
  interventions and the interplay between information and disease spread to the modelling of sexually transmitted
  infections and behaviour-driven epidemics.


  Besides my primary research, I keep several active collaborations with researchers from other areas (human genetics,
  machine learning, theoretical ecology, protein engineering, cancer research, social science, geostatistics). If
  you feel like your research could use some extra modelling, let''s get in touch!'
