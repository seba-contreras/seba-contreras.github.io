- key: contreras2020novel
  title: A novel synthetic model of the glucose-insulin system for patient-wise inference of physiological
    parameters from small-size OGTT data
  authors: <strong>Seba Contreras</strong>, David Medina-Ortiz, Carlos Conca, Alvaro Olivera-Nappa
  journal: Frontiers in Bioengineering and Biotechnology
  year: 2020
  date: '2020-03-01'
  doi: 10.3389/fbioe.2020.00195
  type: article
  abstract: Existing mathematical models for the glucose-insulin (G-I) dynamics often involve variables
    that are not susceptible to direct measurement. Standard clinical tests for measuring G-I levels for
    diagnosing potential diseases are simple and relatively cheap, but seldom give enough information
    to allow the identification of model parameters within the range in which they have a biological meaning,
    thus generating a gap between mathematical modeling and any possible physiological explanation or
    clinical interpretation. In the present work, we present a synthetic mathematical model to represent
    the G-I dynamics in an Oral Glucose Tolerance Test (OGTT), which involves for the first time for OGTT-related
    models, Delay Differential Equations. Our model can represent the radically different behaviors observed
    in a studied cohort of 407 normoglycemic patients (the largest analyzed so far in parameter fitting
    experiments), all masked under the current threshold-based normality criteria. We also propose a novel
    approach to solve the parameter fitting inverse problem, involving the clustering of different G-I
    profiles, a simulation-based exploration of the feasible set, and the construction of an information
    function which reshapes it, based on the clinical records, experimental uncertainties, and physiological
    criteria. This method allowed an individual-wise recognition of the parameters of our model using
    small size OGTT data (5 measurements) directly, without modifying the routine procedures or requiring
    particular clinical setups. Therefore, our methodology can be easily applied to gain parametric insights
    to complement the existing tools for the diagnosis of G-I dysregulations. We tested the parameter
    stability and sensitivity for individual subjects, and an empirical relationship between such indexes
    and curve shapes was spotted. Since different G-I profiles, under the light of our model, are related
    to different physiological mechanisms, the present method offers a tool for personally-oriented diagnosis
    and treatment and to better define new health criteria.
  ref: 8, 195
- key: medina2020nonlinear
  title: Development of Supervised Learning Predictive Models for Highly Non-linear Biological, Biomedical,
    and General Datasets
  authors: David Medina-Ortiz, <strong>Seba Contreras</strong>, Cristofer Quiroz, Alvaro Olivera-Nappa
  journal: Frontiers in Molecular Biosciences
  year: 2020
  date: '2020-02-01'
  doi: 10.3389/fmolb.2020.00013
  type: article
  abstract: In highly non-linear datasets, attributes or features do not allow readily finding visual
    patterns for identifying common underlying behaviors. Therefore, it is not possible to achieve classification
    or regression using linear or mildly non-linear hyperspace partition functions. Hence, supervised
    learning models based on the application of most existing algorithms are limited, and their performance
    metrics are low. Linear transformations of variables, such as principal components analysis, cannot
    avoid the problem, and even models based on artificial neural networks and deep learning are unable
    to improve the metrics. Sometimes, even when features allow classification or regression in reported
    cases, performance metrics of supervised learning algorithms remain unsatisfyingly low. This problem
    is recurrent in many areas of study as, per example, the clinical, biotechnological, and protein engineering
    areas, where many of the attributes are correlated in an unknown and very non-linear fashion or are
    categorical and difficult to relate to a target response variable. In such areas, being able to create
    predictive models would dramatically impact the quality of their outcomes, generating an immediate
    added value for both the scientific and general public. In this manuscript, we present RV-Clustering,
    a library of unsupervised learning algorithms, and a new methodology designed to find optimum partitions
    within highly non-linear datasets that allow deconvoluting variables and notoriously improving performance
    metrics in supervised learning classification or regression models. The partitions obtained are statistically
    cross-validated, ensuring correct representativity and no over-fitting. We have successfully tested
    RV-Clustering in several highly non-linear datasets with different origins. The approach herein proposed
    has generated classification and regression models with high-performance metrics, which further supports
    its ability to generate predictive models for highly non-linear datasets. Advantageously, the method
    does not require significant human input, which guarantees a higher usability in the biological, biomedical,
    and protein engineering community with no specific knowledge in the machine learning area.
